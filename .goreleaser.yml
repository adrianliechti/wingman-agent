version: 2

before:
  hooks:
    - go generate ./...
    - go mod tidy

builds:
  - id: wingman
    binary: wingman
    main: ./cmd/wingman
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: wingman
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows users expect zip.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

report_sizes: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# macOS and Linux: Homebrew cask.
homebrew_casks:
  - name: wingman-cli
    # The installed command stays `wingman` (the built binary name).
    binaries: [wingman]
    # The publisher adds postflight_steps; GoReleaser's hooks still emit postflight.
    skip_upload: true
    repository:
      owner: adrianliechti
      name: homebrew-tap

    commit_author:
      name: Adrian Liechti
      email: adrian@localhost

    homepage: "https://github.com/adrianliechti/wingman-agent"
    description: "AI-powered coding assistant for your terminal"

publishers:
  - name: homebrew-cask
    # Select only the extra cask file, not the archives with ID "wingman".
    ids: [wingman-cli]
    extra_files:
      - glob: dist/homebrew/Casks/wingman-cli.rb
    env:
      - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}
    cmd: ./scripts/publish-cask.sh {{ .Version }} wingman-cli

# Windows: Scoop bucket.
scoops:
  - repository:
      owner: adrianliechti
      name: scoop-bucket

    commit_author:
      name: Adrian Liechti
      email: adrian@localhost
